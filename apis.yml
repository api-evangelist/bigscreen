aid: bigscreen
name: BigScreen
description: >-
  Bigscreen is a social virtual-reality company founded in 2014 by Darshan
  Shankar. Its flagship Bigscreen app lets people watch movies, mirror their
  Windows PC desktop, play games, and hang out with friends inside shared
  virtual rooms across major VR platforms. In 2023 the company shipped the
  Bigscreen Beyond, an ultra-compact, custom-fit OLED PC-VR headset, followed
  by the Beyond 2 line. Bigscreen is a consumer VR hardware and software
  company backed by Andreessen Horowitz (a16z) and other investors; it does not
  currently operate a public developer program or REST API. This profile is
  maintained in the API Evangelist network as a company record.
